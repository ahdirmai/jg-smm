# Pre-commit hooks for MVP-1-SMM.
# Install once:   pipx install pre-commit  (or: brew install pre-commit)
#                 pre-commit install
#
# Hooks are intentionally fast and deterministic. Heavier checks (lint, tests,
# OpenAPI drift, Trivy) run in CI — see .github/workflows/ci.yml.

repos:
  # --- Secrets: block credentials before they ever reach a commit ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (detect hardcoded secrets)

  # --- Hygiene: catch obvious local mistakes early ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: mixed-line-ending
        args: ['--fix=lf']
      # Keep committed JSON/YAML tidy without touching generated artefacts.
      - id: detect-private-key
