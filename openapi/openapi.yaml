openapi: 3.0.3
info:
  title: SMM API
  version: 0.1.0
  description: |
    Social Media Management API. This spec is the single source of truth for the
    HTTP contract: Go server/handler types are generated with `oapi-codegen` and
    FE types with `openapi-typescript` into `packages/shared`. Do not hand-write
    DTOs on either side.
servers:
  - url: http://localhost:24080
    description: Local development
tags:
  - name: health
  - name: auth
  - name: admin
  - name: internal

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: All dependencies reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: One or more dependencies are down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in and start a session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established. Sets `smm_at` and `smm_rt` cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and mint a new access token
      operationId: refresh
      responses:
        '200':
          description: New session. Rotates the active refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current refresh token
      operationId: logout
      responses:
        '204':
          description: Logged out. Clears auth cookies.

  /api/auth/me:
    get:
      tags: [auth]
      summary: Return the authenticated principal
      operationId: getMe
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/accounts:
    post:
      tags: [accounts]
      summary: Add a worker account
      description: |
        Stores an account (credential sealed at rest with AES-256-GCM) and
        packs it into the first container with a free platform slot,
        auto-creating an AUTO container when the fleet is full and
        PROVISION_AUTO_CREATE is on. Requires the `act` permission.
      operationId: createAccount
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created (and packed when a slot exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      tags: [accounts]
      summary: List worker accounts
      description: Returns every account without credentials.
      operationId: listAccounts
      security:
        - accessCookie: []
      responses:
        '200':
          description: Accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/accounts/import:
    post:
      tags: [accounts]
      summary: Bulk-import worker accounts
      description: |
        Validates and creates up to 100 account rows in one request. Each row
        is created independently: a row that fails validation is reported, not
        fatal, so one bad row does not discard the rest. The whole call is
        rate-limited to 10 per minute per caller (P4-07).
      operationId: importAccounts
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportAccountsRequest'
      responses:
        '200':
          description: Import result (always 200; per-row failures are in the body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [accounts]
      summary: Pause or resume an account
      description: |
        `pause` suspends use (the session survives on the container PVC);
        `resume` reactivates without a fresh login.
      operationId: setAccountStatus
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccountStatusRequest'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [accounts]
      summary: Remove an account
      description: |
        Releases the container slot (an AUTO container that empties is reaped)
        and deletes the account row.
      operationId: deleteAccount
      security:
        - accessCookie: []
      responses:
        '204':
          description: Account removed.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/actions:
    post:
      tags: [actions]
      summary: Enqueue action jobs
      description: |
        Creates up to 50 like/comment jobs, one per target. Comment text is NOT
        sent: it is composed from the template pool and denylist-screened at
        dispatch time (P3-02/P3-03), so the only thing stored here is the
        intent (account, target, action type). Requires the `act` permission.
      operationId: enqueueActions
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnqueueActionsRequest'
      responses:
        '201':
          description: Jobs enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionJobList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      tags: [actions]
      summary: List the action queue
      description: |
        Returns action jobs newest-first with their latest attempt, so the
        queue view can show live status. The worker writes the verdict via the
        internal callback; this is the read side.
      operationId: listActions
      security:
        - accessCookie: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionJobList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/templates:
    post:
      tags: [templates]
      summary: Add a comment template
      description: |
        One variant in the comment pool (P3-02). Platform-scoped, weighted, and
        carrying its own denylist. Every banned-word entry must compile as a
        regex or the request is a 400 (validasi inline, P3-03).
      operationId: createTemplate
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          description: Template created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentTemplate'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      tags: [templates]
      summary: List comment templates
      operationId: listTemplates
      security:
        - accessCookie: []
      parameters:
        - name: platform
          in: query
          schema:
            $ref: '#/components/schemas/Platform'
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    put:
      tags: [templates]
      summary: Replace a comment template
      description: |
        Full-row update: text, vars, weight, banned words and active flag all
        change together from one request. A denylist entry that does not compile
        is a 400.
      operationId: updateTemplate
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '200':
          description: Template updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentTemplate'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [templates]
      summary: Delete a comment template
      description: |
        Soft question only in the sense that past action_logs keep their
        template_id; the pool row itself is removed.
      operationId: deleteTemplate
      security:
        - accessCookie: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/containers:
    post:
      tags: [containers]
      summary: Create a container manually
      description: |
        Creates a MANUAL worker container in the RUNNING desired state. The
        reconciler provisions its pod+PVC from the row. MANUAL containers are
        never auto-deleted, even at zero accounts (the operator owns their life).
        Requires the `act` permission (OPERATOR+).
      operationId: createContainer
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContainerRequest'
      responses:
        '201':
          description: Container created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Container'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      tags: [containers]
      summary: List containers
      description: Returns every container with its hosted accounts.
      operationId: listContainers
      security:
        - accessCookie: []
      responses:
        '200':
          description: Containers and their accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/locations:
    get:
      tags: [containers]
      summary: List selectable worker locations
      description: |
        The city list a worker can be anchored to (P-location). The dashboard
        dropdown renders this; the create request validates against it. Each
        city carries the centre the API randomizes a frozen GPS point around.
      operationId: listLocations
      security:
        - accessCookie: []
      responses:
        '200':
          description: Cities a worker may operate from.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/containers/{containerId}:
    parameters:
      - $ref: '#/components/parameters/ContainerId'
    delete:
      tags: [containers]
      summary: Delete a container
      description: |
        Sets desired state STOPPED; the reconciler tears down pod+PVC+service
        and the row is removed. Requires the `act` permission.
      operationId: deleteContainer
      security:
        - accessCookie: []
      responses:
        '204':
          description: Container deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/admin/ping:
    get:
      tags: [admin]
      summary: RBAC-guarded example endpoint
      description: Requires the `admin` permission (OWNER only).
      operationId: adminPing
      security:
        - accessCookie: []
      responses:
        '200':
          description: Caller holds the admin permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/proxy-groups:
    post:
      tags: [proxy-groups]
      summary: Create a proxy group
      description: |
        Stores a residential proxy pool. The pool key is sealed at rest with
        AES-256-GCM and is write-only: it is never returned by any endpoint.
        Requires the `act` permission.
      operationId: createProxyGroup
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProxyGroupRequest'
      responses:
        '201':
          description: Proxy group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyGroup'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      tags: [proxy-groups]
      summary: List proxy groups
      description: Returns every proxy group without pool keys.
      operationId: listProxyGroups
      security:
        - accessCookie: []
      responses:
        '200':
          description: Proxy groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyGroupList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/official-accounts:
    post:
      tags: [official-accounts]
      summary: Add a monitored (official) account
      description: |
        Registers a brand/client account for read-only analytics. An official
        account has no credentials and performs no actions — it is only the
        subject of metrics pulled from a 3rd-party provider (PRD F5). Requires
        the `act` permission.
      operationId: createOfficialAccount
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfficialAccountRequest'
      responses:
        '201':
          description: Official account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialAccount'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      tags: [official-accounts]
      summary: List official accounts
      description: Returns every monitored account, optionally filtered by platform.
      operationId: listOfficialAccounts
      security:
        - accessCookie: []
      parameters:
        - name: platform
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Platform'
      responses:
        '200':
          description: Official accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialAccountList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/official-accounts/{officialAccountId}:
    parameters:
      - $ref: '#/components/parameters/OfficialAccountId'
    delete:
      tags: [official-accounts]
      summary: Archive an official account
      description: |
        Archives the account: history stays queryable, but it is excluded from
        the next ingest run. The row is never deleted so historical analytics
        remain reproducible.
      operationId: archiveOfficialAccount
      security:
        - accessCookie: []
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialAccount'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/analytics/overview:
    get:
      tags: [analytics]
      summary: Analytics overview across every platform
      description: |
        The KPI strip for the monitoring overview: the latest value of each
        cross-platform metric per official account, over the trailing window.
        Requires the `read` permission; analysts can read analytics.
      operationId: analyticsOverview
      security:
        - accessCookie: []
      parameters:
        - name: windowDays
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: KPI overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/analytics/{platform}:
    parameters:
      - name: platform
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Platform'
    get:
      tags: [analytics]
      summary: Per-platform analytics
      description: |
        KPI strip + trend series + top posts for one platform. Mirrors
        PLATFORM_MATRIX §2.3: the shape is identical across platforms, the
        available metrics differ.
      operationId: analyticsByPlatform
      security:
        - accessCookie: []
      parameters:
        - name: metric
          in: query
          required: false
          schema:
            type: string
            default: followers
        - name: windowDays
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: Platform analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAnalytics'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/analytics/refresh:
    post:
      tags: [analytics]
      summary: Trigger an analytics ingest run
      description: |
        Enqueues a provider pull on demand. The dashboard's refresh button hits
        this; it never talks to the provider directly. Returns the audit run so
        the caller can show freshness immediately.
      operationId: analyticsRefresh
      security:
        - accessCookie: []
      responses:
        '200':
          description: Ingest run started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsIngestRun'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/reports/actions:
    get:
      tags: [reports]
      summary: Action report
      description: |
        Daily rollup of executed actions (P4-04): one row per day × account ×
        action type, with success/failure counts, plus a per-day series for the
        chart. Read-only — the `read` permission sees it, `export` takes the
        file out (P4-05).
      operationId: reportActions
      security:
        - accessCookie: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: platform
          in: query
          schema:
            $ref: '#/components/schemas/Platform'
        - name: accountId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The rollup rows and the series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionReport'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/reports/targets:
    get:
      tags: [reports]
      summary: Target (post) report
      description: |
        The same action jobs grouped by the post they were aimed at (P4-04),
        so a strategist can see which content attracted engagement.
      operationId: reportTargets
      security:
        - accessCookie: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: platform
          in: query
          schema:
            $ref: '#/components/schemas/Platform'
      responses:
        '200':
          description: The per-target rollup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetReport'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/reports/analytics:
    get:
      tags: [reports]
      summary: Official-account growth report
      description: |
        One monitored account's metric series over the window (P4-04). This is
        the read side of the analytics ingest (P2-12), not a scrape trigger.
      operationId: reportAnalytics
      security:
        - accessCookie: []
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
        - name: metric
          in: query
          schema:
            type: string
            default: followers
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The account's series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReport'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/reports/export:
    get:
      tags: [reports]
      summary: Export a report as CSV or JSON
      description: |
        Streams the selected report (P4-05). CSV is written row-by-row so a
        large window never buffers in memory; JSON is the same rows as the
        typed endpoints. Requires the `export` permission.
      operationId: reportExport
      security:
        - accessCookie: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [actions, targets, analytics]
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: platform
          in: query
          schema:
            $ref: '#/components/schemas/Platform'
        - name: accountId
          in: query
          schema:
            type: string
        - name: metric
          in: query
          schema:
            type: string
            default: followers
      responses:
        '200':
          description: The report file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/proxy-groups/{proxyGroupId}:
    parameters:
      - $ref: '#/components/parameters/ProxyGroupId'
    delete:
      tags: [proxy-groups]
      summary: Delete a proxy group
      description: |
        Removes the pool. Accounts referencing it fall back to no proxy (the
        column is ON DELETE SET NULL), so a delete never strands an account.
      operationId: deleteProxyGroup
      security:
        - accessCookie: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/audit:
    get:
      tags: [audit]
      summary: List the audit trail
      description: |
        Returns who did what, when: one row per state-changing call
        (account/container/template/user create/update/delete, action
        enqueue), newest first, with the actor's email resolved and the
        request IP. Filters are all optional. Requires the `read` permission.
      operationId: listAudit
      security:
        - accessCookie: []
      parameters:
        - name: actorId
          in: query
          schema:
            type: string
          description: Filter to one user's actions.
        - name: action
          in: query
          schema:
            type: string
          description: e.g. `account.create`.
        - name: entity
          in: query
          schema:
            type: string
          description: e.g. `account`, `worker`, `template`.
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on the entry time.
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Exclusive upper bound on the entry time.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Page size.
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page offset.
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/users:
    get:
      tags: [users]
      summary: List team members
      description: |
        Returns every user in the single-team MVP with their role. Requires
        the `read` permission.
      operationId: listUsers
      security:
        - accessCookie: []
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [users]
      summary: Create / invite a team member
      description: |
        Adds a user with a provisional password the operator shares out of
        band (the MVP has no email transport wired for invites). The password
        is argon2id-hashed; it is never returned. Requires `admin` (OWNER).
      operationId: createUser
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      summary: Update a team member
      description: |
        Changes a member's role and/or name. Changing a role revokes that
        user's refresh sessions so the new role applies immediately. Requires
        `admin` (OWNER).
      operationId: updateUser
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [users]
      summary: Remove a team member
      description: |
        Deletes the user. The last OWNER cannot be removed (the team must keep
        an admin), and an account cannot delete itself. Requires `admin`.
      operationId: deleteUser
      security:
        - accessCookie: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/stream:
    get:
      tags: [stream]
      summary: Server-sent events channel
      description: |
        The dashboard's one server-to-browser channel (ADR 0010). Frames are
        `event: <kind>` with a JSON `data:` body carrying the full entity, so
        the client reconciles without a second fetch. Commands still go over
        REST. Requires the `act` permission.

        Event kinds: `account-updated`, `worker-health`, `provision-updated`.
        The connection is kept open; an idle connection receives a `: keep-alive`
        comment every 15s. On drop the browser's EventSource reconnects and
        refetches.
      operationId: streamEvents
      security:
        - accessCookie: []
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /internal/action-callback:
    post:
      tags: [internal]
      summary: Record an action attempt verdict
      description: |
        Posted by a worker after an action attempt completes. Workers never touch
        the database (ADR 0011): they report outcomes here. Body is capped at 64 KiB.
      operationId: postActionCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCallback'
      responses:
        '200':
          description: Verdict recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAck'
        '400':
          $ref: '#/components/responses/Error'

  /internal/account-callback:
    post:
      tags: [internal]
      summary: Record an account auth outcome
      description: |
        Posted by a worker when a login/2FA flow finishes (or needs input).
        Reports the account auth status; credentials are never sent back.
      operationId: postAccountCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCallback'
      responses:
        '200':
          description: Outcome recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAck'
        '400':
          $ref: '#/components/responses/Error'

  /internal/heartbeat:
    post:
      tags: [internal]
      summary: Record a worker heartbeat
      description: |
        Posted by each worker every 30s. Three consecutive failures make the
        worker self-exit. Carries resource telemetry and the current job.
      operationId: postHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '200':
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAck'
        '400':
          $ref: '#/components/responses/Error'

  /internal/worker/{workerId}/geolocation:
    get:
      tags: [internal]
      summary: Read a worker's frozen GPS coordinates
      description: |
        Called by the worker once at boot so Playwright can spoof a fixed
        position before any job runs. The point is randomized inside the
        worker's city at create time and never changes, so a worker keeps a
        stable GPS fingerprint. 404 when the worker has no location set.
      operationId: getWorkerGeolocation
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The worker's frozen coordinate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerGeolocation'
        '404':
          $ref: '#/components/responses/Error'

components:
  parameters:
    ContainerId:
      name: containerId
      in: path
      required: true
      schema:
        type: string
      description: The container ID.
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
      description: The account ID.
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
      description: The template ID.
    ProxyGroupId:
      name: proxyGroupId
      in: path
      required: true
      schema:
        type: string
      description: The proxy group ID.

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: The user ID.

    OfficialAccountId:
      name: officialAccountId
      in: path
      required: true
      schema:
        type: string
      description: The official (monitored) account ID.

  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: smm_at

  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    LoginResponse:
      type: object
      required: [accessExpiry, user]
      properties:
        accessExpiry:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    MeResponse:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      enum: [OWNER, STRATEGIST, OPERATOR, ANALYST]

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    StreamEvent:
      type: object
      description: One server-sent events frame.
      required: [kind, data]
      properties:
        kind:
          type: string
          description: The SSE `event:` line; the client dispatches on this.
          enum:
            - account-updated
            - worker-health
            - provision-updated
        data:
          type: object
          additionalProperties: true
          description: The full entity payload, sent on the `data:` line as JSON.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    CallbackAck:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean

    WorkerGeolocation:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        location:
          type: string
          description: The city the point was randomized within.

    CreateContainerRequest:
      type: object
      required: [region, location]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional display name. Omit to get a generated name.
        region:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 region for proxy placement.
          example: ID
        location:
          type: string
          minLength: 2
          description: City the worker operates from; picks the GPS radius to
            randomize a frozen coordinate from. One of GET /api/locations.
          example: Jakarta
        novncPort:
          type: integer
          nullable: true
          minimum: 1024
          maximum: 65535
          description: Optional host port to publish the live view on
            (127.0.0.1 only). Omit to let the API allocate one from
            NOVNC_PORT_MIN..NOVNC_PORT_MAX. Out-of-range or taken ports are a 400.
          example: 24150

    Container:
      type: object
      required: [id, name, desiredState, source, region, status, generation, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        desiredState:
          type: string
          enum: [RUNNING, STOPPED]
        source:
          type: string
          enum: [MANUAL, AUTO]
        region:
          type: string
          description: ISO 3166-1 alpha-2 country code the worker operates in.
        location:
          type: string
          nullable: true
          description: City the worker is anchored to; null on pre-geolocation rows.
        latitude:
          type: number
          format: double
          nullable: true
          description: Frozen GPS latitude inside the city radius.
        longitude:
          type: number
          format: double
          nullable: true
          description: Frozen GPS longitude inside the city radius.
        status:
          type: string
          enum: [PENDING, READY, IDLE, BUSY, DRAINING, ERROR, DEAD, QUARANTINED]
        generation:
          type: integer
        observedGeneration:
          type: integer
          nullable: true
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/ContainerAccount'
        createdAt:
          type: string
          format: date-time
        novncUrl:
          type: string
          nullable: true
          description: Browser-reachable noVNC view URL (P4-08); null when unpublished.

    Location:
      type: object
      required: [name, latitude, longitude, radiusKm]
      properties:
        name:
          type: string
          description: City name; the value CreateContainerRequest.location takes.
          example: Jakarta
        latitude:
          type: number
          format: double
          description: City centre latitude.
        longitude:
          type: number
          format: double
          description: City centre longitude.
        radiusKm:
          type: number
          format: double
          description: Radius the API randomizes a worker's frozen point within.

    ContainerAccount:
      type: object
      required: [id, platform, username, authStatus, status]
      properties:
        id:
          type: string
        platform:
          type: string
          enum: [instagram, threads, facebook, linkedin, x, youtube, tiktok]
        username:
          type: string
        authStatus:
          type: string
          enum: [AUTHENTICATING, NEEDS_INPUT, AUTHENTICATED, FAILED, QUARANTINED]
        status:
          type: string
          enum: [ACTIVE, PAUSED, ARCHIVED, DEAD]

    ContainerList:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          items:
            $ref: '#/components/schemas/Container'

    CreateAccountRequest:
      type: object
      required: [platform, username, password]
      properties:
        platform:
          type: string
          enum: [instagram, threads, facebook, linkedin, x, youtube, tiktok]
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
          description: Sealed at rest; never returned or logged.
        proxyGroupId:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string

    ImportAccountsRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          maxItems: 100
          description: One row per account; the cap is the import batch.
          items:
            $ref: '#/components/schemas/CreateAccountRequest'

    ImportResult:
      type: object
      required: [queued, invalid, rateLimited]
      description: |
        The import verdict. `queued` counts created rows; `invalid` lists the
        rows rejected by validation or a duplicate; `rateLimited` is true when
        the caller exceeded the import rate budget and rows were refused.
      properties:
        queued:
          type: integer
          description: Accounts created (and packed when a slot exists).
        invalid:
          type: array
          description: One entry per rejected row, with a reason.
          items:
            type: object
            required: [row, reason]
            properties:
              row:
                type: integer
                description: Zero-based index into the request rows.
              reason:
                type: string
        rateLimited:
          type: boolean

    Account:
      type: object
      required: [id, platform, username, authStatus, status]
      properties:
        id:
          type: string
        platform:
          type: string
          enum: [instagram, threads, facebook, linkedin, x, youtube, tiktok]
        username:
          type: string
        handle:
          type: string
          nullable: true
        authStatus:
          type: string
          enum: [AUTHENTICATING, NEEDS_INPUT, AUTHENTICATED, FAILED, QUARANTINED]
        status:
          type: string
          enum: [ACTIVE, PAUSED, ARCHIVED, DEAD]
        workerId:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        lastError:
          type: string
          nullable: true

    AccountList:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'

    Platform:
      type: string
      description: The social platform. MVP active set is Instagram + Threads.
      enum: [instagram, threads, facebook, linkedin, x, youtube, tiktok]

    OfficialAccount:
      type: object
      description: |
        A monitored brand/client account (read-only). NOT a worker account: no
        credentials, no actions. The subject of 3rd-party analytics.
      required: [id, platform, handle, status, provider]
      properties:
        id:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        handle:
          type: string
        displayName:
          type: string
          nullable: true
        profileUrl:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, paused, archived]
        provider:
          type: string
        tags:
          type: array
          items:
            type: string
        lastFetchedAt:
          type: string
          format: date-time
          nullable: true
          description: Null until the first successful ingest — the freshness signal.
        stale:
          type: boolean
          description: True when lastFetchedAt is older than the 60-minute threshold.
        createdAt:
          type: string
          format: date-time

    OfficialAccountList:
      type: object
      required: [officialAccounts]
      properties:
        officialAccounts:
          type: array
          items:
            $ref: '#/components/schemas/OfficialAccount'

    CreateOfficialAccountRequest:
      type: object
      required: [platform, handle]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        handle:
          type: string
        displayName:
          type: string
        profileUrl:
          type: string
        avatarUrl:
          type: string
        provider:
          type: string
          default: thirdparty_a
        tags:
          type: array
          items:
            type: string

    AnalyticsKpi:
      type: object
      description: One scalar KPI for one account.
      required: [officialAccountId, metric, value]
      properties:
        officialAccountId:
          type: string
        handle:
          type: string
        metric:
          type: string
        value:
          type: integer
          format: int64
          nullable: true

    TrendPoint:
      type: object
      required: [bucket, value]
      properties:
        bucket:
          type: string
          format: date-time
        value:
          type: integer
          format: int64

    AnalyticsOverview:
      type: object
      required: [kpis, freshness]
      properties:
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsKpi'
        freshness:
          $ref: '#/components/schemas/AnalyticsFreshness'

    PlatformAnalytics:
      type: object
      required: [platform, kpis, trend, freshness]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsKpi'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        freshness:
          $ref: '#/components/schemas/AnalyticsFreshness'

    ActionReportRow:
      type: object
      description: One day × account × action type in the action report.
      required: [day, accountId, username, platform, actionType, total, succeeded, failed]
      properties:
        day:
          type: string
          format: date
        accountId:
          type: string
        username:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        actionType:
          type: string
          enum: [action_like, action_comment, action_report, action_reply_comment]
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer

    ActionReport:
      type: object
      required: [rows, series]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ActionReportRow'
        series:
          type: array
          description: Per-day totals across the whole selection, for the chart.
          items:
            $ref: '#/components/schemas/TrendPoint'

    TargetReportRow:
      type: object
      description: One target (post) with its action outcome counts.
      required: [id, url, platform, total, succeeded, failed]
      properties:
        id:
          type: string
        url:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer

    TargetReport:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TargetReportRow'

    AnalyticsReport:
      type: object
      required: [accountId, metric, series]
      properties:
        accountId:
          type: string
        metric:
          type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'

    AnalyticsFreshness:
      type: object
      description: "Backs the dashboard's stale badge (P2-15 AC: stale when older than 60 minutes)."
      required: [stale]
      properties:
        lastRunStatus:
          type: string
          nullable: true
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        stale:
          type: boolean
        thresholdSeconds:
          type: integer

    AnalyticsIngestRun:
      type: object
      required: [id, provider, scope, status, startedAt]
      properties:
        id:
          type: string
        provider:
          type: string
        scope:
          type: string
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        accountsOk:
          type: integer
        accountsErr:
          type: integer
        errorClass:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    ProxyGroup:
      type: object
      description: |
        A residential proxy pool. The pool key is write-only and never present
        in a response.
      required: [id, name, region, provider, maxConcurrency, dailyBudgetMb]
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
          description: ISO 3166-1 alpha-2.
        provider:
          type: string
        maxConcurrency:
          type: integer
          minimum: 1
        dailyBudgetMb:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time

    ProxyGroupList:
      type: object
      required: [proxyGroups]
      properties:
        proxyGroups:
          type: array
          items:
            $ref: '#/components/schemas/ProxyGroup'

    CreateProxyGroupRequest:
      type: object
      required: [name, region, provider, poolKey, maxConcurrency, dailyBudgetMb]
      properties:
        name:
          type: string
        region:
          type: string
          description: ISO 3166-1 alpha-2.
        provider:
          type: string
        poolKey:
          type: string
          description: Write-only; sealed at rest, never returned.
        maxConcurrency:
          type: integer
          minimum: 1
        dailyBudgetMb:
          type: integer
          minimum: 1

    CreateUserRequest:
      type: object
      required: [email, name, role, password]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          format: password
          description: Write-only; argon2id-hashed, never returned.

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    AuditLog:
      type: object
      description: One immutable audit-trail entry.
      required: [id, action, entity, entityId, result, ts]
      properties:
        id:
          type: string
        actorId:
          type: string
          description: Empty for system-initiated rows.
        actor:
          type: string
          description: The user's email, or `system`.
        action:
          type: string
          description: e.g. `account.create`.
        entity:
          type: string
          description: e.g. `account`, `worker`, `template`.
        entityId:
          type: string
        result:
          type: string
          description: '`ok`, or the failure reason.'
        ip:
          type: string
          description: The request IP; empty when unknown.
        ts:
          type: string
          format: date-time

    AuditLogList:
      type: object
      required: [rows, total, limit, offset]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        total:
          type: integer
          description: Entries matching the same filter, for pagination.
        limit:
          type: integer
        offset:
          type: integer

    SetAccountStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, PAUSED]

    ActionCallback:
      type: object
      required: [attemptId, status]
      properties:
        attemptId:
          type: string
        status:
          $ref: '#/components/schemas/AttemptStatus'
        actionType:
          type: string
          description: e.g. like, comment, report.
        targetUrl:
          type: string
        workerId:
          type: string
        screenshotPath:
          type: string
          description: File name only; the server applies path.Base and requires .png.
        error:
          type: string
          maxLength: 4096
        renderedText:
          type: string
          maxLength: 4096
          description: The final comment text the worker posted (template already rendered), stored on the attempt so a verdict replays without the pool.
        responseExcerpt:
          type: string
          maxLength: 1024
          description: First runes of the platform response; the debug trail behind a verdict.
        durationMs:
          type: integer
          format: int64
          minimum: 0
          description: Measured run time of the attempt.

    AttemptStatus:
      type: string
      enum: [SUCCESS, FAILED, RETRY, CANCELLED]

    AccountCallback:
      type: object
      required: [accountId, authStatus]
      properties:
        accountId:
          type: string
        authStatus:
          $ref: '#/components/schemas/AuthStatus'
        handle:
          type: string
          description: Verified platform handle, set after a successful login.
        error:
          type: string
          maxLength: 4096

    AuthStatus:
      type: string
      enum: [AUTHENTICATING, NEEDS_INPUT, AUTHENTICATED, FAILED]

    Heartbeat:
      type: object
      required: [workerId]
      properties:
        workerId:
          type: string
        browserStatus:
          type: string
          enum: [cold, ready, busy, error]
        queueDepth:
          type: integer
          minimum: 0
        currentJobId:
          type: string
        cpu:
          type: number
          format: double
        mem:
          type: number
          format: double
        jobsDone:
          type: integer
          minimum: 0
        lastActionAt:
          type: string
          format: date-time
        novncUrl:
          type: string
          nullable: true
          description: Browser-reachable noVNC view URL (P4-08); null when unpublished.

    EnqueueActionsRequest:
      type: object
      description: |
        A batch of intents. Comment text is deliberately absent: it is composed
        from the template pool at dispatch (P3-02) and denylist-screened before
        the queue (P3-03), so an enqueue only records WHAT to do and WHERE.
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: One job per target; the cap is the queue batch size.
          items:
            $ref: '#/components/schemas/ActionItem'

    ActionItem:
      type: object
      required: [accountId, targetUrl, actionType]
      properties:
        accountId:
          type: string
          description: The worker account that will perform the action.
        targetUrl:
          type: string
          minLength: 1
          description: Permalink of the post to act on. SSRF-guarded server-side.
        actionType:
          type: string
          enum: [action_like, action_comment, action_report, action_reply_comment]
          description: The queue JobType; a like needs no text.

    ActionJob:
      type: object
      description: One enqueued action and its live status.
      required: [id, actionType, accountId, targetId, status, attempts, scheduledAt]
      properties:
        id:
          type: string
        actionType:
          type: string
          enum: [action_like, action_comment, action_report, action_reply_comment]
        accountId:
          type: string
        targetId:
          type: string
        targetUrl:
          type: string
          nullable: true
          description: Resolved at dispatch from the target; null until then.
        status:
          $ref: '#/components/schemas/JobStatus'
        attempts:
          type: integer
          minimum: 0
        scheduledAt:
          type: string
          format: date-time
        error:
          type: string
          nullable: true
        renderedText:
          type: string
          nullable: true
          description: The comment text of the latest attempt, once dispatched.
        errorClass:
          allOf:
            - $ref: '#/components/schemas/ErrorClass'
          nullable: true

    ActionJobList:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionJob'

    JobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCESS, FAILED, CANCELLED]
      description: The queue-side status; the verdict lives on the attempt.

    ErrorClass:
      type: string
      enum: [TRANSIENT, AUTH, RATE_LIMIT, BANNED, UNKNOWN]
      description: |
        Coarse failure classification (P3-12). Only TRANSIENT and RATE_LIMIT are
        retryable: AUTH/BANNED cannot be fixed by running it again.

    CreateTemplateRequest:
      type: object
      description: |
        One pool variant. Every banned-word entry must compile as a regex
        (P3-03); a literal word is a valid regex, so the common case is free.
      required: [platform, text, vars, weight]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        text:
          type: string
          minLength: 1
          description: The variant body. {topic} forms are rendered from vars.
        vars:
          type: array
          items:
            type: string
          description: Every {var} used in text must be declared here, and used.
        weight:
          type: integer
          minimum: 1
          description: Relative pick probability (weight 3 is 3x weight 1).
        bannedWords:
          type: array
          items:
            type: string
          description: Regex denylist screened before a comment is queued.
        isActive:
          type: boolean
          default: true

    CommentTemplate:
      type: object
      required: [id, platform, text, vars, weight, isActive, createdAt]
      properties:
        id:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        text:
          type: string
        vars:
          type: array
          items:
            type: string
        weight:
          type: integer
        bannedWords:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    TemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/CommentTemplate'
