openapi: 3.0.3
info:
  title: SMM API
  version: 0.1.0
  description: |
    Social Media Management API. This spec is the single source of truth for the
    HTTP contract: Go server/handler types are generated with `oapi-codegen` and
    FE types with `openapi-typescript` into `packages/shared`. Do not hand-write
    DTOs on either side.
servers:
  - url: http://localhost:24080
    description: Local development
tags:
  - name: health
  - name: auth
  - name: admin
  - name: internal

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: All dependencies reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: One or more dependencies are down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in and start a session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established. Sets `smm_at` and `smm_rt` cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and mint a new access token
      operationId: refresh
      responses:
        '200':
          description: New session. Rotates the active refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current refresh token
      operationId: logout
      responses:
        '204':
          description: Logged out. Clears auth cookies.

  /api/auth/me:
    get:
      tags: [auth]
      summary: Return the authenticated principal
      operationId: getMe
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/accounts:
    post:
      tags: [accounts]
      summary: Add a worker account
      description: |
        Stores an account (credential sealed at rest with AES-256-GCM) and
        packs it into the first container with a free platform slot,
        auto-creating an AUTO container when the fleet is full and
        PROVISION_AUTO_CREATE is on. Requires the `act` permission.
      operationId: createAccount
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created (and packed when a slot exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      tags: [accounts]
      summary: List worker accounts
      description: Returns every account without credentials.
      operationId: listAccounts
      security:
        - accessCookie: []
      responses:
        '200':
          description: Accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [accounts]
      summary: Pause or resume an account
      description: |
        `pause` suspends use (the session survives on the container PVC);
        `resume` reactivates without a fresh login.
      operationId: setAccountStatus
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccountStatusRequest'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [accounts]
      summary: Remove an account
      description: |
        Releases the container slot (an AUTO container that empties is reaped)
        and deletes the account row.
      operationId: deleteAccount
      security:
        - accessCookie: []
      responses:
        '204':
          description: Account removed.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/containers:
    post:
      tags: [containers]
      summary: Create a container manually
      description: |
        Creates a MANUAL worker container in the RUNNING desired state. The
        reconciler provisions its pod+PVC from the row. MANUAL containers are
        never auto-deleted, even at zero accounts (the operator owns their life).
        Requires the `act` permission (OPERATOR+).
      operationId: createContainer
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContainerRequest'
      responses:
        '201':
          description: Container created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Container'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      tags: [containers]
      summary: List containers
      description: Returns every container with its hosted accounts.
      operationId: listContainers
      security:
        - accessCookie: []
      responses:
        '200':
          description: Containers and their accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/containers/{containerId}:
    parameters:
      - $ref: '#/components/parameters/ContainerId'
    delete:
      tags: [containers]
      summary: Delete a container
      description: |
        Sets desired state STOPPED; the reconciler tears down pod+PVC+service
        and the row is removed. Requires the `act` permission.
      operationId: deleteContainer
      security:
        - accessCookie: []
      responses:
        '204':
          description: Container deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/admin/ping:
    get:
      tags: [admin]
      summary: RBAC-guarded example endpoint
      description: Requires the `admin` permission (OWNER only).
      operationId: adminPing
      security:
        - accessCookie: []
      responses:
        '200':
          description: Caller holds the admin permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/proxy-groups:
    post:
      tags: [proxy-groups]
      summary: Create a proxy group
      description: |
        Stores a residential proxy pool. The pool key is sealed at rest with
        AES-256-GCM and is write-only: it is never returned by any endpoint.
        Requires the `act` permission.
      operationId: createProxyGroup
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProxyGroupRequest'
      responses:
        '201':
          description: Proxy group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyGroup'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      tags: [proxy-groups]
      summary: List proxy groups
      description: Returns every proxy group without pool keys.
      operationId: listProxyGroups
      security:
        - accessCookie: []
      responses:
        '200':
          description: Proxy groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyGroupList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/proxy-groups/{proxyGroupId}:
    parameters:
      - $ref: '#/components/parameters/ProxyGroupId'
    delete:
      tags: [proxy-groups]
      summary: Delete a proxy group
      description: |
        Removes the pool. Accounts referencing it fall back to no proxy (the
        column is ON DELETE SET NULL), so a delete never strands an account.
      operationId: deleteProxyGroup
      security:
        - accessCookie: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/stream:
    get:
      tags: [stream]
      summary: Server-sent events channel
      description: |
        The dashboard's one server-to-browser channel (ADR 0010). Frames are
        `event: <kind>` with a JSON `data:` body carrying the full entity, so
        the client reconciles without a second fetch. Commands still go over
        REST. Requires the `act` permission.

        Event kinds: `account-updated`, `worker-health`, `provision-updated`.
        The connection is kept open; an idle connection receives a `: keep-alive`
        comment every 15s. On drop the browser's EventSource reconnects and
        refetches.
      operationId: streamEvents
      security:
        - accessCookie: []
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /internal/action-callback:
    post:
      tags: [internal]
      summary: Record an action attempt verdict
      description: |
        Posted by a worker after an action attempt completes. Workers never touch
        the database (ADR 0011): they report outcomes here. Body is capped at 64 KiB.
      operationId: postActionCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCallback'
      responses:
        '200':
          description: Verdict recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAck'
        '400':
          $ref: '#/components/responses/Error'

  /internal/account-callback:
    post:
      tags: [internal]
      summary: Record an account auth outcome
      description: |
        Posted by a worker when a login/2FA flow finishes (or needs input).
        Reports the account auth status; credentials are never sent back.
      operationId: postAccountCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCallback'
      responses:
        '200':
          description: Outcome recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAck'
        '400':
          $ref: '#/components/responses/Error'

  /internal/heartbeat:
    post:
      tags: [internal]
      summary: Record a worker heartbeat
      description: |
        Posted by each worker every 30s. Three consecutive failures make the
        worker self-exit. Carries resource telemetry and the current job.
      operationId: postHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '200':
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAck'
        '400':
          $ref: '#/components/responses/Error'

components:
  parameters:
    ContainerId:
      name: containerId
      in: path
      required: true
      schema:
        type: string
      description: The container ID.
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
      description: The account ID.
    ProxyGroupId:
      name: proxyGroupId
      in: path
      required: true
      schema:
        type: string
      description: The proxy group ID.

  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: smm_at

  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    LoginResponse:
      type: object
      required: [accessExpiry, user]
      properties:
        accessExpiry:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    MeResponse:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      enum: [OWNER, STRATEGIST, OPERATOR, ANALYST]

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    StreamEvent:
      type: object
      description: One server-sent events frame.
      required: [kind, data]
      properties:
        kind:
          type: string
          description: The SSE `event:` line; the client dispatches on this.
          enum:
            - account-updated
            - worker-health
            - provision-updated
        data:
          type: object
          additionalProperties: true
          description: The full entity payload, sent on the `data:` line as JSON.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    CallbackAck:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean

    CreateContainerRequest:
      type: object
      required: [region]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional display name. Omit to get a generated name.
        region:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 region for proxy placement.
          example: ID

    Container:
      type: object
      required: [id, name, desiredState, source, region, status, generation, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        desiredState:
          type: string
          enum: [RUNNING, STOPPED]
        source:
          type: string
          enum: [MANUAL, AUTO]
        region:
          type: string
        status:
          type: string
          enum: [PENDING, READY, IDLE, BUSY, DRAINING, ERROR, DEAD, QUARANTINED]
        generation:
          type: integer
        observedGeneration:
          type: integer
          nullable: true
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/ContainerAccount'
        createdAt:
          type: string
          format: date-time

    ContainerAccount:
      type: object
      required: [id, platform, username, authStatus, status]
      properties:
        id:
          type: string
        platform:
          type: string
          enum: [instagram, threads, facebook, linkedin, x, youtube, tiktok]
        username:
          type: string
        authStatus:
          type: string
          enum: [AUTHENTICATING, NEEDS_INPUT, AUTHENTICATED, FAILED, QUARANTINED]
        status:
          type: string
          enum: [ACTIVE, PAUSED, ARCHIVED, DEAD]

    ContainerList:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          items:
            $ref: '#/components/schemas/Container'

    CreateAccountRequest:
      type: object
      required: [platform, username, password]
      properties:
        platform:
          type: string
          enum: [instagram, threads, facebook, linkedin, x, youtube, tiktok]
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
          description: Sealed at rest; never returned or logged.
        proxyGroupId:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string

    Account:
      type: object
      required: [id, platform, username, authStatus, status]
      properties:
        id:
          type: string
        platform:
          type: string
          enum: [instagram, threads, facebook, linkedin, x, youtube, tiktok]
        username:
          type: string
        handle:
          type: string
          nullable: true
        authStatus:
          type: string
          enum: [AUTHENTICATING, NEEDS_INPUT, AUTHENTICATED, FAILED, QUARANTINED]
        status:
          type: string
          enum: [ACTIVE, PAUSED, ARCHIVED, DEAD]
        workerId:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        lastError:
          type: string
          nullable: true

    AccountList:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'

    ProxyGroup:
      type: object
      description: |
        A residential proxy pool. The pool key is write-only and never present
        in a response.
      required: [id, name, region, provider, maxConcurrency, dailyBudgetMb]
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
          description: ISO 3166-1 alpha-2.
        provider:
          type: string
        maxConcurrency:
          type: integer
          minimum: 1
        dailyBudgetMb:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time

    ProxyGroupList:
      type: object
      required: [proxyGroups]
      properties:
        proxyGroups:
          type: array
          items:
            $ref: '#/components/schemas/ProxyGroup'

    CreateProxyGroupRequest:
      type: object
      required: [name, region, provider, poolKey, maxConcurrency, dailyBudgetMb]
      properties:
        name:
          type: string
        region:
          type: string
          description: ISO 3166-1 alpha-2.
        provider:
          type: string
        poolKey:
          type: string
          description: Write-only; sealed at rest, never returned.
        maxConcurrency:
          type: integer
          minimum: 1
        dailyBudgetMb:
          type: integer
          minimum: 1

    SetAccountStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, PAUSED]

    ActionCallback:
      type: object
      required: [attemptId, status]
      properties:
        attemptId:
          type: string
        status:
          $ref: '#/components/schemas/AttemptStatus'
        actionType:
          type: string
          description: e.g. like, comment, report.
        targetUrl:
          type: string
        workerId:
          type: string
        screenshotPath:
          type: string
          description: File name only; the server applies path.Base and requires .png.
        error:
          type: string
          maxLength: 4096

    AttemptStatus:
      type: string
      enum: [SUCCESS, FAILED, RETRY, CANCELLED]

    AccountCallback:
      type: object
      required: [accountId, authStatus]
      properties:
        accountId:
          type: string
        authStatus:
          $ref: '#/components/schemas/AuthStatus'
        handle:
          type: string
          description: Verified platform handle, set after a successful login.
        error:
          type: string
          maxLength: 4096

    AuthStatus:
      type: string
      enum: [AUTHENTICATING, NEEDS_INPUT, AUTHENTICATED, FAILED]

    Heartbeat:
      type: object
      required: [workerId]
      properties:
        workerId:
          type: string
        browserStatus:
          type: string
          enum: [cold, ready, busy, error]
        queueDepth:
          type: integer
          minimum: 0
        currentJobId:
          type: string
        cpu:
          type: number
          format: double
        mem:
          type: number
          format: double
        jobsDone:
          type: integer
          minimum: 0
        lastActionAt:
          type: string
          format: date-time
