<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Analytics — SMM Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    data-title="X — Analytics"
    data-subtitle="Official accounts (monitored) · X"
    data-actions='<button class="btn btn-outline btn-sm"><i data-lucide="calendar" class="w-4 h-4"></i>Last 30 days</button><button class="btn btn-primary btn-sm"><i data-lucide="download" class="w-4 h-4"></i>Export</button>'
  >
    <div id="app">
      <!-- Official account selector + provider note -->
      <section class="flex flex-wrap items-center gap-2">
        <select class="input w-56">
          <option>All official accounts</option>
          <option>@x.official</option>
          <option>@x.brand</option>
        </select>
        <select class="input w-40"><option>All regions</option><option>sg</option><option>id</option></select>
        <button class="btn btn-outline btn-sm"><i data-lucide="users" class="w-4 h-4"></i>Compare accounts</button>
        <div class="ml-auto text-xs muted">Source: <span class="badge badge-info">3rd-party analytics</span> · read-only</div>
      </section>

      <section class="grid grid-cols-2 gap-4 lg:grid-cols-4" id="kpis"></section>

      <section class="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <div id="chart" class="contents"></div>
        <div class="card p-4">
          <h2 class="text-sm font-semibold">Audience</h2>
          <p class="text-xs muted">Follower mix</p>
          <div class="mt-4 space-y-3 text-sm">
            <div><div class="flex justify-between"><span>US</span><span class="mono">36%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[36%] rounded-full bg-primary"></div></div></div>
            <div><div class="flex justify-between"><span>Indonesia</span><span class="mono">24%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[24%] rounded-full bg-primary"></div></div></div>
            <div><div class="flex justify-between"><span>UK</span><span class="mono">18%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[18%] rounded-full bg-primary"></div></div></div>
            <div><div class="flex justify-between"><span>Other</span><span class="mono">22%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[22%] rounded-full bg-primary"></div></div></div>
          </div>
          <div class="mt-4 sep"></div>
          <div class="mt-3 flex items-center justify-between text-xs"><span class="muted">Follower growth (30d)</span><span class="text-success">▲ 1,120</span></div>
        </div>
      </section>

      <section class="card">
        <div class="flex items-center justify-between border-b border-border p-4">
          <div><h2 class="text-sm font-semibold">Top posts</h2><p class="text-xs muted">Instagram · last 30 days</p></div>
          <button class="btn btn-outline btn-sm"><i data-lucide="filter" class="w-4 h-4"></i>Filter</button>
        </div>
        <div class="overflow-x-auto">
          <table class="tbl">
            <thead><tr><th>Post</th><th>Type</th><th>Date</th><th class="text-right" id="post-metrics"></th></tr></thead>
            <tbody id="posts"></tbody>
          </table>
        </div>
      </section>

      <section id="analytics-empty" class="hidden card p-4 text-xs muted">
        Not yet enabled in the MVP — layout shown for review.
      </section>
    </div>

    <script>
      window.ANALYTICS = {
        metrics: [
          { label: 'Impressions', value: 142800, delta: 9.8, icon: 'eye' },
          { label: 'Engagements', value: 18600, delta: 5.5, icon: 'activity' },
          { label: 'Likes', value: 7420, delta: 4.9, icon: 'heart' },
          { label: 'Reposts', value: 1840, delta: 7.2, icon: 'repeat' },
          { label: 'Replies', value: 920, delta: 2.1, icon: 'reply' },
          { label: 'Bookmarks', value: 610, delta: 3.4, icon: 'bookmark' },
        ],
        seriesA: [110, 124, 118, 140, 152, 148, 168, 182, 195, 188, 208, 225, 238, 246, 262],
        seriesB: [30, 36, 33, 42, 48, 46, 56, 62, 68, 66, 74, 82, 88, 92, 100],
        trendTitle: 'Impressions vs Engagements',
        posts: [
          { title: "Post · \"Hot take on cold outreach\"", kind: 'Post', date: 'Sep 12', m1: 32400, m2: 4100, m3: 820 },
          { title: "Thread · \"10 tools we actually use\"", kind: 'Thread', date: 'Sep 08', m1: 18600, m2: 2600, m3: 540 },
          { title: "Post · \"Launch day 🚀\"", kind: 'Post', date: 'Sep 04', m1: 12800, m2: 1900, m3: 380 },
        ],
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="shell.js"></script>
    <script src="analytics.js"></script>
  </body>
</html>
