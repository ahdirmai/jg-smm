<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Analytics — SMM Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    data-title="Instagram — Analytics"
    data-subtitle="Official accounts (monitored) · Instagram"
    data-actions='<button class="btn btn-outline btn-sm"><i data-lucide="calendar" class="w-4 h-4"></i>Last 30 days</button><button class="btn btn-primary btn-sm"><i data-lucide="download" class="w-4 h-4"></i>Export</button>'
  >
    <div id="app">
      <!-- Official account selector + provider note -->
      <section class="flex flex-wrap items-center gap-2">
        <select class="input w-56">
          <option>All official accounts</option>
          <option>@growth.hacks.id</option>
          <option>@daily.deals</option>
          <option>@shop.abc</option>
        </select>
        <select class="input w-40">
          <option>All regions</option>
          <option>sg</option>
          <option>id</option>
        </select>
        <button class="btn btn-outline btn-sm">
          <i data-lucide="users" class="w-4 h-4"></i>Compare accounts
        </button>
        <div class="ml-auto text-xs muted">
          Source: <span class="badge badge-info">3rd-party analytics</span> · read-only
        </div>
      </section>

      <section class="grid grid-cols-2 gap-4 lg:grid-cols-4" id="kpis"></section>

      <section class="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <div id="chart" class="contents"></div>
        <div class="card p-4">
          <h2 class="text-sm font-semibold">Audience</h2>
          <p class="text-xs muted">Follower mix</p>
          <div class="mt-4 space-y-3 text-sm">
            <div>
              <div class="flex justify-between">
                <span>Indonesia</span><span class="mono">48%</span>
              </div>
              <div class="mt-1 h-1.5 rounded-full bg-secondary">
                <div class="h-full w-[48%] rounded-full bg-primary"></div>
              </div>
            </div>
            <div>
              <div class="flex justify-between">
                <span>Singapore</span><span class="mono">21%</span>
              </div>
              <div class="mt-1 h-1.5 rounded-full bg-secondary">
                <div class="h-full w-[21%] rounded-full bg-primary"></div>
              </div>
            </div>
            <div>
              <div class="flex justify-between">
                <span>Malaysia</span><span class="mono">14%</span>
              </div>
              <div class="mt-1 h-1.5 rounded-full bg-secondary">
                <div class="h-full w-[14%] rounded-full bg-primary"></div>
              </div>
            </div>
            <div>
              <div class="flex justify-between">
                <span>Other</span><span class="mono">17%</span>
              </div>
              <div class="mt-1 h-1.5 rounded-full bg-secondary">
                <div class="h-full w-[17%] rounded-full bg-primary"></div>
              </div>
            </div>
          </div>
          <div class="mt-4 sep"></div>
          <div class="mt-3 flex items-center justify-between text-xs">
            <span class="muted">Follower growth (30d)</span
            ><span class="text-success">▲ 4,213</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="flex items-center justify-between border-b border-border p-4">
          <div>
            <h2 class="text-sm font-semibold">Top posts</h2>
            <p class="text-xs muted">Instagram · last 30 days</p>
          </div>
          <button class="btn btn-outline btn-sm">
            <i data-lucide="filter" class="w-4 h-4"></i>Filter
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="tbl">
            <thead>
              <tr>
                <th>Post</th>
                <th>Type</th>
                <th>Date</th>
                <th class="text-right" id="post-metrics"></th>
              </tr>
            </thead>
            <tbody id="posts"></tbody>
          </table>
        </div>
      </section>

      <section id="analytics-empty" class="hidden card p-4 text-xs muted">
        Not yet enabled in the MVP — layout shown for review.
      </section>
    </div>

    <script>
      window.ANALYTICS = {
        metrics: [
          { label: 'Reach', value: 184200, delta: 12.4, icon: 'eye' },
          { label: 'Reels views', value: 92700, delta: 21.0, icon: 'play-circle' },
          { label: 'Likes', value: 9412, delta: 3.1, icon: 'heart' },
          { label: 'Saves', value: 1874, delta: 6.8, icon: 'bookmark' },
          { label: 'Comments', value: 1208, delta: -1.8, icon: 'message-circle' },
          { label: 'Profile visits', value: 7600, delta: 2.2, icon: 'user' },
        ],
        seriesA: [120, 135, 128, 150, 162, 158, 175, 190, 205, 198, 220, 240, 255, 262, 280],
        seriesB: [60, 72, 68, 80, 95, 90, 105, 118, 130, 126, 140, 155, 168, 172, 184],
        trendTitle: 'Reach vs Reels views',
        posts: [
          {
            title: 'Reels · "3 growth hacks we use daily"',
            kind: 'Reel',
            date: 'Sep 12',
            m1: 42118,
            m2: 38902,
            m3: 2104,
          },
          {
            title: 'Carousel · "Before / after automation"',
            kind: 'Carousel',
            date: 'Sep 09',
            m1: 19776,
            m2: 12340,
            m3: 1210,
          },
          {
            title: 'Reels · "Behind the scenes"',
            kind: 'Reel',
            date: 'Sep 05',
            m1: 15209,
            m2: 21005,
            m3: 980,
          },
          {
            title: 'Image · "New feature is live"',
            kind: 'Image',
            date: 'Sep 02',
            m1: 9840,
            m2: 0,
            m3: 512,
          },
        ],
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="shell.js"></script>
    <script src="analytics.js"></script>
  </body>
</html>
