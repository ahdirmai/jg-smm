<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Analytics — SMM Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    data-title="TikTok — Analytics"
    data-subtitle="Official accounts (monitored) · TikTok"
    data-actions='<button class="btn btn-outline btn-sm"><i data-lucide="calendar" class="w-4 h-4"></i>Last 30 days</button><button class="btn btn-primary btn-sm"><i data-lucide="download" class="w-4 h-4"></i>Export</button>'
  >
    <div id="app">
      <!-- Official account selector + provider note -->
      <section class="flex flex-wrap items-center gap-2">
        <select class="input w-56">
          <option>All official accounts</option>
          <option>@tiktok.official</option>
          <option>@tiktok.brand</option>
        </select>
        <select class="input w-40"><option>All regions</option><option>sg</option><option>id</option></select>
        <button class="btn btn-outline btn-sm"><i data-lucide="users" class="w-4 h-4"></i>Compare accounts</button>
        <div class="ml-auto text-xs muted">Source: <span class="badge badge-info">3rd-party analytics</span> · read-only</div>
      </section>

      <section class="grid grid-cols-2 gap-4 lg:grid-cols-4" id="kpis"></section>

      <section class="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <div id="chart" class="contents"></div>
        <div class="card p-4">
          <h2 class="text-sm font-semibold">Audience</h2>
          <p class="text-xs muted">Follower mix</p>
          <div class="mt-4 space-y-3 text-sm">
            <div><div class="flex justify-between"><span>Indonesia</span><span class="mono">42%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[42%] rounded-full bg-primary"></div></div></div>
            <div><div class="flex justify-between"><span>US</span><span class="mono">22%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[22%] rounded-full bg-primary"></div></div></div>
            <div><div class="flex justify-between"><span>Philippines</span><span class="mono">18%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[18%] rounded-full bg-primary"></div></div></div>
            <div><div class="flex justify-between"><span>Other</span><span class="mono">18%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[18%] rounded-full bg-primary"></div></div></div>
          </div>
          <div class="mt-4 sep"></div>
          <div class="mt-3 flex items-center justify-between text-xs"><span class="muted">Follower growth (30d)</span><span class="text-success">▲ 21,800</span></div>
        </div>
      </section>

      <section class="card">
        <div class="flex items-center justify-between border-b border-border p-4">
          <div><h2 class="text-sm font-semibold">Top posts</h2><p class="text-xs muted">Instagram · last 30 days</p></div>
          <button class="btn btn-outline btn-sm"><i data-lucide="filter" class="w-4 h-4"></i>Filter</button>
        </div>
        <div class="overflow-x-auto">
          <table class="tbl">
            <thead><tr><th>Post</th><th>Type</th><th>Date</th><th class="text-right" id="post-metrics"></th></tr></thead>
            <tbody id="posts"></tbody>
          </table>
        </div>
      </section>

      <section id="analytics-empty" class="hidden card p-4 text-xs muted">
        Not yet enabled in the MVP — layout shown for review.
      </section>
    </div>

    <script>
      window.ANALYTICS = {
        metrics: [
          { label: 'Views', value: 512600, delta: 24.1, icon: 'play-circle' },
          { label: 'Likes', value: 42300, delta: 15.3, icon: 'heart' },
          { label: 'Comments', value: 3840, delta: 8.8, icon: 'message-circle' },
          { label: 'Shares', value: 2960, delta: 12.6, icon: 'share-2' },
          { label: 'Followers', value: 21800, delta: 7.4, icon: 'user-plus' },
          { label: 'Watch time (h)', value: 15600, delta: 9.9, icon: 'clock' },
        ],
        seriesA: [180, 210, 200, 240, 268, 258, 290, 318, 340, 330, 362, 395, 418, 432, 460],
        seriesB: [60, 74, 70, 88, 102, 98, 116, 130, 142, 138, 156, 172, 184, 192, 206],
        trendTitle: 'Views vs Likes',
        posts: [
          { title: "Video · \"POV: you automate everything\"", kind: 'Video', date: 'Sep 12', m1: 142000, m2: 12800, m3: 1820 },
          { title: "Video · \"60s growth tip\"", kind: 'Video', date: 'Sep 09', m1: 86400, m2: 7400, m3: 1120 },
          { title: "Video · \"Day in the life\"", kind: 'Video', date: 'Sep 04', m1: 52300, m2: 5100, m3: 760 },
        ],
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="shell.js"></script>
    <script src="analytics.js"></script>
  </body>
</html>
