<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Analytics — SMM Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    data-title="YouTube — Analytics"
    data-subtitle="Official accounts (monitored) · YouTube"
    data-actions='<button class="btn btn-outline btn-sm"><i data-lucide="calendar" class="w-4 h-4"></i>Last 30 days</button><button class="btn btn-primary btn-sm"><i data-lucide="download" class="w-4 h-4"></i>Export</button>'
  >
    <div id="app">
      <!-- Official account selector + provider note -->
      <section class="flex flex-wrap items-center gap-2">
        <select class="input w-56">
          <option>All official accounts</option>
          <option>@youtube.official</option>
          <option>@youtube.brand</option>
        </select>
        <select class="input w-40"><option>All regions</option><option>sg</option><option>id</option></select>
        <button class="btn btn-outline btn-sm"><i data-lucide="users" class="w-4 h-4"></i>Compare accounts</button>
        <div class="ml-auto text-xs muted">Source: <span class="badge badge-info">3rd-party analytics</span> · read-only</div>
      </section>

      <section class="grid grid-cols-2 gap-4 lg:grid-cols-4" id="kpis"></section>

      <section class="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <div id="chart" class="contents"></div>
        <div class="card p-4">
          <h2 class="text-sm font-semibold">Audience</h2>
          <p class="text-xs muted">Follower mix</p>
          <div class="mt-4 space-y-3 text-sm">
            <div><div class="flex justify-between"><span>US</span><span class="mono">34%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[34%] rounded-full bg-primary"></div></div></div>
            <div><div class="flex justify-between"><span>Indonesia</span><span class="mono">26%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[26%] rounded-full bg-primary"></div></div></div>
            <div><div class="flex justify-between"><span>India</span><span class="mono">22%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[22%] rounded-full bg-primary"></div></div></div>
            <div><div class="flex justify-between"><span>Other</span><span class="mono">18%</span></div><div class="mt-1 h-1.5 rounded-full bg-secondary"><div class="h-full w-[18%] rounded-full bg-primary"></div></div></div>
          </div>
          <div class="mt-4 sep"></div>
          <div class="mt-3 flex items-center justify-between text-xs"><span class="muted">Follower growth (30d)</span><span class="text-success">▲ 12,480</span></div>
        </div>
      </section>

      <section class="card">
        <div class="flex items-center justify-between border-b border-border p-4">
          <div><h2 class="text-sm font-semibold">Top posts</h2><p class="text-xs muted">Instagram · last 30 days</p></div>
          <button class="btn btn-outline btn-sm"><i data-lucide="filter" class="w-4 h-4"></i>Filter</button>
        </div>
        <div class="overflow-x-auto">
          <table class="tbl">
            <thead><tr><th>Post</th><th>Type</th><th>Date</th><th class="text-right" id="post-metrics"></th></tr></thead>
            <tbody id="posts"></tbody>
          </table>
        </div>
      </section>

      <section id="analytics-empty" class="hidden card p-4 text-xs muted">
        Not yet enabled in the MVP — layout shown for review.
      </section>
    </div>

    <script>
      window.ANALYTICS = {
        metrics: [
          { label: 'Views', value: 386400, delta: 16.7, icon: 'play-circle' },
          { label: 'Watch time (h)', value: 21800, delta: 11.2, icon: 'clock' },
          { label: 'Subscribers', value: 12480, delta: 5.8, icon: 'user-plus' },
          { label: 'CTR (%)', value: 6.4, delta: 1.1, icon: 'mouse-pointer-click' },
          { label: 'Impressions', value: 642000, delta: 9.3, icon: 'eye' },
          { label: 'Avg view (min)', value: 4.8, delta: 2.7, icon: 'timer' },
        ],
        seriesA: [140, 160, 152, 180, 196, 190, 215, 232, 248, 240, 262, 285, 300, 312, 330],
        seriesB: [70, 84, 80, 96, 108, 104, 120, 132, 142, 138, 152, 168, 178, 186, 198],
        trendTitle: 'Views vs Watch time',
        posts: [
          { title: "Video · \"Full automation walkthrough\"", kind: 'Video', date: 'Sep 12', m1: 84200, m2: 6200, m3: 1240 },
          { title: "Short · \"One trick to save time\"", kind: 'Short', date: 'Sep 09', m1: 52100, m2: 3100, m3: 860 },
          { title: "Video · \"Q&A: your top questions\"", kind: 'Video', date: 'Sep 03', m1: 28400, m2: 2400, m3: 410 },
        ],
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="shell.js"></script>
    <script src="analytics.js"></script>
  </body>
</html>
