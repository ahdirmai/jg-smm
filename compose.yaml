# P0-02 walking skeleton. Local runtime = colima (linux/arm64 on Apple Silicon).
# Everything runs as containers; no Kubernetes. Worker replicas are scaled with
# `--scale worker=N` (max 3 on a 16 GB machine — see docs/INFRA_ANALYST.md §15.2).
name: smm

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smm}
      POSTGRES_USER: ${POSTGRES_USER:-smm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-24543}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smm} -d ${POSTGRES_DB:-smm}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    ports:
      - '${REDIS_PORT:-24637}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smmsmmsmm}
    volumes:
      - miniodata:/data
    ports:
      - '${MINIO_PORT:-24900}:9000'
      - '${MINIO_CONSOLE_PORT:-24901}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the buckets the API/workers expect. Idempotent.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-smm}" "${MINIO_ROOT_PASSWORD:-smmsmmsmm}"
        mc mb --ignore-existing local/raw-payload
        mc mb --ignore-existing local/screenshots
        mc mb --ignore-existing local/sessions
        echo "minio buckets ready"

  # Runs pending migrations then exits. API waits for successful completion.
  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/db/migrations:/migrations:ro
    command:
      - '-path=/migrations'
      - '-database=postgres://${POSTGRES_USER:-smm}:${POSTGRES_PASSWORD:-smm}@postgres:5432/${POSTGRES_DB:-smm}?sslmode=disable'
      - 'up'

  api:
    build:
      context: ./apps/api
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smm}:${POSTGRES_PASSWORD:-smm}@postgres:5432/${POSTGRES_DB:-smm}?sslmode=disable
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-smm}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smmsmmsmm}
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: ${MINIO_ROOT_USER:-smm}
      MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD:-smmsmmsmm}
      MINIO_BUCKET: ${MINIO_BUCKET:-smm-raw}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-thirdparty_a}
      ANALYTICS_PROVIDER_BASE_URL: ${ANALYTICS_PROVIDER_BASE_URL:-https://provider.example.com/v1}
      ANALYTICS_PROVIDER_KEY: ${ANALYTICS_PROVIDER_KEY:-dev-stub-provider-key}
      ANALYTICS_INGEST_INTERVAL_SECONDS: ${ANALYTICS_INGEST_INTERVAL_SECONDS:-0}
      # P2-05 top-post re-sampler and P2-07 alert engine: opt-in loops, off by
      # default so a local `make up` never starts background work.
      AGGREGATE_INTERVAL_SECONDS: ${AGGREGATE_INTERVAL_SECONDS:-0}
      ALERT_INTERVAL_SECONDS: ${ALERT_INTERVAL_SECONDS:-0}
      # P3-07 action scheduler: claim due jobs -> cooldown + rate-limit gates ->
      # worker queue. Off by default; enable to run the action engine.
      ACTION_INTERVAL_SECONDS: ${ACTION_INTERVAL_SECONDS:-0}
      PROVISIONER_MODE: ${PROVISIONER_MODE:-docker}
      # The reconciler is what actually provisions a dashboard-created row
      # (F-02): leave it on locally so Create reaches a container.
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-5}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-smm_default}
      DOCKER_PUBLIC_HOST: ${DOCKER_PUBLIC_HOST:-localhost}
      NOVNC_PORT_MIN: ${NOVNC_PORT_MIN:-24100}
      NOVNC_PORT_MAX: ${NOVNC_PORT_MAX:-24299}
      WORKER_IMAGE: ${WORKER_IMAGE:-smm-worker}
      WORKER_PLATFORMS: ${WORKER_PLATFORMS:-instagram,threads}
      ACTION_DRY_RUN: ${ACTION_DRY_RUN:-true}
      PROVISION_AUTO_CREATE: ${PROVISION_AUTO_CREATE:-true}
      ACTION_BATCH_PARALLELISM: ${ACTION_BATCH_PARALLELISM:-2}
      # Anti-detection: min seconds between ANY two actions on one account
      # (per-account velocity gate; 0 disables). Bounds a like+comment+reply
      # burst that a per-target cooldown alone cannot.
      ACTION_ACCOUNT_PACE_SECONDS: ${ACTION_ACCOUNT_PACE_SECONDS:-480}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
      JWT_ISSUER: ${JWT_ISSUER:-smm-api}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-v0k2nMVGJAq5Ta69vg36gcxNB4wiClCeOFMC6WBemH8=}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # P5-08 cost ceilings. 0 publishes no gauge and disables the budget alert;
      # set them in production so the 90% alert has a real number to divide.
      APIFY_BUDGET_USD: ${APIFY_BUDGET_USD:-0}
      PROXY_BUDGET_GB: ${PROXY_BUDGET_GB:-0}
      # Scrape: sync on-demand runs from the dashboard need the token. The
      # background scheduler stays off unless SCRAPE_INTERVAL_SECONDS is set.
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_BASE_URL: ${APIFY_BASE_URL:-https://api.apify.com/v2}
      APIFY_ACTOR_PREFIX: ${APIFY_ACTOR_PREFIX:-~smm}
      # LLM (OpenAI-compatible) for AI comment generation. Empty key disables
      # the endpoint (503), never a request with a blank credential.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # P4-06 weekly report digest. Off by default; bring the `mail` profile up
      # (`COMPOSE_PROFILES=mail make up`) and set the interval to run it.
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-reports@smm.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      REPORT_EMAIL_INTERVAL_SECONDS: ${REPORT_EMAIL_INTERVAL_SECONDS:-0}
      REPORT_EMAIL_TO: ${REPORT_EMAIL_TO:-}
      REPORT_EMAIL_WINDOW_DAYS: ${REPORT_EMAIL_WINDOW_DAYS:-7}
    ports:
      - '${API_PORT:-24080}:8080'
    # Local tier (F-06): the docker driver dials the daemon socket, which the
    # image's nonroot user cannot open. Root + the socket mount is a local-only
    # tradeoff (docs/SECURITY_REVIEW.md); the k8s tier keeps its own path.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ['CMD', '/app/server', 'healthcheck']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Behind the `fleet` profile (F-08): a bare `make up` starts zero workers —
  # containers are created from the dashboard, where the API allocates the
  # live-view port and binds it. Bring replicas up the old way with
  # `make up-fleet`, which publishes 6080 as before.
  worker:
    profiles: ['fleet']
    # Named image: the docker driver references WORKER_IMAGE=smm-worker when it
    # launches a dashboard-created container, so the image must build under a
    # stable tag regardless of which profile brought it up.
    image: ${WORKER_IMAGE:-smm-worker}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runtime
    # No container_name: the service is scaled with `--scale worker=N`.
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      # WORKER_ID is derived from the container hostname at runtime (see entrypoint).
      API_URL: http://api:8080
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      ACTION_DRY_RUN: ${ACTION_DRY_RUN:-true}
      PLATFORMS: ${WORKER_PLATFORMS:-instagram,threads}
      # P4-08 live view. NOVNC_URL wins when the operator knows the exact
      # reachable address; NOVNC_BASE_URL + the container's NOVNC_PORT is the
      # shared-host form. Empty = unpublished; the dashboard disables the button.
      NOVNC_URL: ${WORKER_NOVNC_URL:-}
      NOVNC_BASE_URL: ${WORKER_NOVNC_BASE_URL:-}
      NOVNC_PORT: ${WORKER_NOVNC_PORT:-6080}
    volumes:
      - sessions:/data/sessions
      - screenshots:/data/screenshots
    # noVNC live screen. Published per-replica: compose assigns a unique host
    # port automatically, so `--scale worker=N` never collides. The worker
    # reports its own reachable URL via NOVNC_URL/NOVNC_BASE_URL (P4-08).
    expose:
      - '6080'
    ports:
      - '6080'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        # Inlined into the client bundle at build time; a plain runtime `env`
        # below is too late for NEXT_PUBLIC_*.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:24080}
        NEXT_PUBLIC_SSE_URL: ${NEXT_PUBLIC_SSE_URL:-http://localhost:24080/api/stream}
    depends_on:
      api:
        condition: service_started
    ports:
      - '${WEB_PORT:-24081}:3000'

  # P5-03 observability stack. Off unless OBS_ENABLED=1: the app runs without
  # it, and a local `make up` on a 16 GB machine should not spend half its RAM
  # on dashboards it is not looking at.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ['obs']
    volumes:
      - ./infra/obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/obs/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - ./infra/obs/alertmanager.yml:/etc/prometheus/alertmanager.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - '${PROMETHEUS_PORT:-24090}:9090'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ['obs']
    volumes:
      - ./infra/obs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    ports:
      - '${ALERTMANAGER_PORT:-24093}:9093'

  loki:
    image: grafana/loki:3.2.1
    profiles: ['obs']
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - lokidata:/loki
    ports:
      - '${LOKI_PORT:-24310}:3100'

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ['obs']
    depends_on:
      - prometheus
    volumes:
      - ./infra/obs/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafanadata:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '${GRAFANA_PORT:-24030}:3000'

  # Mailpit catches the weekly report digest locally (P4-06). It is opt-in via
  # the `mail` profile so a bare `make up` never needs a mail server.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ['mail']
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '${MAILPIT_SMTP_PORT:-24025}:1025'
      - '${MAILPIT_UI_PORT:-24026}:8025'

volumes:
  pgdata:
  redisdata:
  miniodata:
  sessions:
  screenshots:
  prometheusdata:
  alertmanagerdata:
  lokidata:
  grafanadata:
