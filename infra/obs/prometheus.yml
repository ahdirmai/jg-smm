# Prometheus scrape config (P5-03). The API exposes /metrics on the standard
# path; the worker is a browser runner and has no metrics endpoint, so it is
# scraped through the API's worker gauges rather than directly.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Every series carries the deployment, so a staging alert never joins a
    # production dashboard.
    deployment: ${PROM_DEPLOYMENT_LABEL:-local}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ${ALERTMANAGER_TARGET:-alertmanager:9093}

scrape_configs:
  - job_name: smm-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']
        labels:
          service: smm-api
