# Alertmanager routing (P5-03). Slack is the paging channel; the alert carries
# its runbook link so the responder opens the right page instead of searching.
route:
  receiver: slack
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    # Critical pages immediately and repeats until acknowledged; a critical
    # alert grouped behind a warning is how a ban wave goes unnoticed.
    - matchers:
        - severity="critical"
      receiver: slack
      group_wait: 0s
      repeat_interval: 15m

receivers:
  - name: slack
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '${SLACK_CHANNEL:-#smm-alerts}'
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} [{{ .CommonLabels.severity }}]'
        text: '{{ .CommonAnnotations.summary }}\nRunbook: {{ .CommonAnnotations.runbook }}'
