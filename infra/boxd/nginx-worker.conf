# Worker reverse proxy (boxd smm-worker-01..10).
#
# Contract with the ticket scheme in apps/api/internal/service/novnc_ticket.go:
# the signed ticket rides INSIDE the noVNC `path` query parameter, because that
# is the value the browser forwards as the WebSocket path. It is NOT on the
# outer page URL.
#
# Therefore auth_request must gate the SOCKET only. Mounting it on the whole
# `/novnc/` prefix would 403 `vnc.html` and every static asset, and the live
# view would never load. The worker also re-verifies the ticket itself
# (/internal/verify-ticket), so this location is the outer of two checks.

upstream smm_rpc  { server 127.0.0.1:8090; }
upstream smm_novnc { server 127.0.0.1:6080; }

server {
    listen 0.0.0.0:8000;
    server_name _;

    # Machine routes: X-Internal-Secret is checked by the worker, not here, so a
    # wrong secret is a 401 from the app (constant-time compare) rather than an
    # opaque 403 from the proxy.
    location /internal/ {
        client_max_body_size 2m;   # matches MaxCallbackBytes (session + JPEG)
        proxy_pass http://smm_rpc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://smm_rpc/healthz;
    }

    # The noVNC client and its assets: public by design. They carry no account
    # state; the socket below does.
    location /novnc/ {
        proxy_pass http://smm_novnc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # THE GATE. Exact match on the WebSocket endpoint so auth_request never
    # falls through to the page or assets.
    location = /novnc/websockify {
        auth_request /_auth_ticket;
        proxy_pass http://smm_novnc/websockify;

        # RFB is a long-lived bidirectional stream.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Subrequest target: the worker validates exp + worker name + HMAC and
    # answers 204 (allow) or 403 (deny). The ticket arrives here from the
    # WebSocket path, which the noVNC client builds from its `path` parameter.
    location = /_auth_ticket {
        internal;
        proxy_pass http://smm_rpc/internal/verify-ticket?ticket=$arg_ticket;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
}
