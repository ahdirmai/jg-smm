# Production tier for boxd `smm-hub`: data + api + web behind one nginx on :8000.
# boxd's edge proxies port 8000 only, so nginx is the single entrypoint.
# Usage (on the VM, from the repo root so --env-file resolves):
#   docker compose --env-file .env -f infra/boxd/compose.hub.yaml up -d --build
name: smm

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Jakarta
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['127.0.0.1:${POSTGRES_PORT:-24543}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    ports: ['127.0.0.1:${REDIS_PORT:-24637}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: pgsty/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    ports: ['127.0.0.1:${MINIO_PORT:-24900}:9000']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        for b in raw-payload screenshots sessions; do mc mb --ignore-existing local/$$b; done
        echo "minio buckets ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ../../apps/api/db/migrations:/migrations:ro
    command:
      - '-path=/migrations'
      - '-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable'
      - 'up'

  api:
    build:
      context: ../../apps/api
      target: runtime
    env_file: ../../.env
    environment:
      # Container-network addresses override the host-facing values in .env.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: ${MINIO_ROOT_USER}
      MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: 'false'
      DOCKER_NETWORK: smm_default
      DOCKER_PUBLIC_HOST: ${DOCKER_PUBLIC_HOST:-smm.ahdirmai.my.id}
      TZ: Asia/Jakarta
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    # Local tier: the docker driver dials the daemon socket, which the image's
    # nonroot user cannot open (docs/SECURITY_REVIEW.md).
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose: ['8080']
    healthcheck:
      test: ['CMD', '/app/server', 'healthcheck']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SSE_URL: ${NEXT_PUBLIC_SSE_URL}
    environment:
      TZ: Asia/Jakarta
      HOSTNAME: '0.0.0.0'
    depends_on:
      api: {condition: service_started}
    expose: ['3000']
    restart: unless-stopped

  # Single public listener: boxd edge terminates TLS and proxies to :8000.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-hub.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ['8000:8000']
    depends_on:
      api: {condition: service_started}
      web: {condition: service_started}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
