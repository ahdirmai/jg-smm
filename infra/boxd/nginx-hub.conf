# smm-hub entrypoint. boxd edge -> :8000 (TLS terminated at the edge, so the
# upstream scheme here is plain http).
server {
    listen 8000 default_server;
    server_name _;

    client_max_body_size 10m;
    proxy_read_timeout 3600s;   # SSE (/api/stream) is long-lived
    proxy_buffering off;        # stream frames must not be buffered

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /internal/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://api:8080;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
